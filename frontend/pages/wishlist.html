<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist - Voyago</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="wishlist-page">

<div class="page-header">
<h1>My Wishlist ❤️</h1>

<input
type="text"
placeholder="Search destinations..."
class="search-box">
</div>

<div class="wishlist-top">
<button id="openWishlistModal" class="primary-btn">
    + Add Destination
</button>

</div>

<div class="wishlist-grid" id="wishlistContainer">

</div>


</div>

</div>
<div class="modal" id="wishlistModal">

    <div class="modal-content">

        <span id="closeWishlistModal">&times;</span>

        <h2>Add Destination</h2>

        <input
            type="text"
            id="wishDestination"
            placeholder="Destination">

        <input
            type="text"
            id="wishCountry"
            placeholder="Country">

        <input
            type="text"
            id="wishImage"
            placeholder="Image URL">

        <button id="saveWishlistBtn">
            Save Destination
        </button>

    </div>

</div>

<script src="../js/script.js"></script>
<script src="../js/wishlist.js"></script>

</body>
</html>
